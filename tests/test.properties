# ═══════════════════════════════════════════════════════════════════════════════
# test.properties — Configuración centralizada de tests DEVIA
# ═══════════════════════════════════════════════════════════════════════════════
# TODOS los parámetros de tests se cambian AQUÍ y solo aquí.
# Los tests leen este fichero a través de conftest.py → TestConfig
#
# AUTODETECCIÓN:
#   - QWEN3_HOST=auto → se detecta automáticamente escaneando la LAN
#   - DB_HOST=auto    → se lee del .env del proyecto
#
# PRIVACIDAD:
#   - ENFORCE_LAN_ONLY=true → cualquier conexión a internet falla el test
#   - ALLOWED_NETWORKS se usa para validar que todo es LAN
# ═══════════════════════════════════════════════════════════════════════════════

# ─── Base de datos Firebird ───────────────────────────────────────────────────
# "auto" = leer del .env del proyecto
DB_HOST=auto
DB_PORT=auto
DB_NAME=auto
DB_USER=auto
DB_PASSWORD=auto

# ─── Qwen3 LAN ───────────────────────────────────────────────────────────────
# "auto" = autodetectar escaneando la LAN en el puerto QWEN3_PORT
QWEN3_HOST=auto
QWEN3_PORT=11434
QWEN3_SCAN_SUBNET=192.168.0
QWEN3_SCAN_TIMEOUT_S=1
QWEN3_API_KEY=auto

# ─── Privacidad y seguridad ───────────────────────────────────────────────────
# Si true, cualquier conexión a internet durante los tests → FALLO inmediato
ENFORCE_LAN_ONLY=true

# Redes LAN permitidas (separadas por coma)
ALLOWED_NETWORKS=127.,192.168.,10.,172.16.,172.17.,172.18.,172.19.,172.20.,172.21.,172.22.,172.23.,172.24.,172.25.,172.26.,172.27.,172.28.,172.29.,172.30.,172.31.,::1,0.0.0.0

# ─── Umbrales de tests ────────────────────────────────────────────────────────
# Tiempo máximo de respuesta para MetaGlass (segundos)
METAGLASS_MAX_RESPONSE_TIME_S=30

# Tiempo máximo de respuesta para web (segundos)
WEB_MAX_RESPONSE_TIME_S=60

# Longitud máxima de respuesta MetaGlass (chars) — para TTS
METAGLASS_MAX_RESPONSE_LEN=500

# Longitud máxima de respuesta web (chars)
WEB_MAX_RESPONSE_LEN=10000

# ─── Paginación ───────────────────────────────────────────────────────────────
# Umbral de registros para activar resumen (debe coincidir con response_summarizer.py)
SUMMARY_THRESHOLD=15
PAGE_SIZE_DEFAULT=10
PAGE_SIZE_MAX=100

# Umbral específico para MetaGlass (gafas): si hay más de N registros,
# las gafas preguntan si quieren ir listando poco a poco (paginación por voz)
# Valor más bajo que SUMMARY_THRESHOLD porque el TTS no puede leer listas largas
METAGLASS_PAGINATION_THRESHOLD=5
METAGLASS_PAGE_SIZE=3

# Si true, usar IA (Qwen3 LAN) para interpretar la intención de paginación del usuario
# Si false, usar detección determinista (más rápido, menos preciso)
USE_AI_PAGINATION_INTENT=true

# ─── Cobertura mínima del SIUO ────────────────────────────────────────────────
# % mínimo de conceptos críticos que deben estar mapeados
MIN_SIUO_COVERAGE_PCT=70

# ─── Logs ─────────────────────────────────────────────────────────────────────
LOG_DIR=logs
LOG_LEVEL=DEBUG
LOG_NETWORK_AUDIT=true
LOG_SQL_TRACE=true
LOG_AI_REQUESTS=true

# ─── Comportamiento de tests ──────────────────────────────────────────────────
# Si true, los tests de integración se saltan si BD/Qwen3 no están disponibles
SKIP_IF_UNAVAILABLE=true

# Si true, ejecutar tests de regresión conocida (marcados como xfail)
RUN_REGRESSION_TESTS=true

# Número máximo de reintentos para tests de integración
MAX_RETRIES=2
