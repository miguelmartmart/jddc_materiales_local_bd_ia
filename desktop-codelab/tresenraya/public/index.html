<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tres en Raya</title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }
    #juego {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .casilla {
      background-color: #f0f0f0;
      padding: 20px;
      border: 1px solid #ccc;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Tres en Raya</h1>
  <div id="juego">
    <div class="casilla" id="c1"></div>
    <div class="casilla" id="c2"></div>
    <div class="casilla" id="c3"></div>
    <div class="casilla" id="c4"></div>
    <div class="casilla" id="c5"></div>
    <div class="casilla" id="c6"></div>
    <div class="casilla" id="c7"></div>
    <div class="casilla" id="c8"></div>
    <div class="casilla" id="c9"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
