[pytest]
# Configuración de pytest para interjddcia
testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Añadir el directorio raíz al PYTHONPATH para que los imports de backend.* funcionen
pythonpath = .

# Mostrar output detallado
addopts = -v --tb=short
